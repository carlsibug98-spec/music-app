openapi: 3.1.0
info:
  title: Resona API
  version: 0.1.0
  description: |
    Private music streaming API (no login — device-key auth, blueprint Ch. 5).

    M0 skeleton: all 29 v1 endpoint contracts are declared (28 paths;
    likes and library each combine PUT/DELETE into one contract row).
    M1 implements device registration, catalog, search, browse, home,
    stations, listen capture, and recents. Playlist/library/personalization/
    chart paths carry their contracts (request/response shapes) and are
    implemented in M2–M5 as the roadmap dictates. Keep this file and
    @resona/api-types in sync.
servers:
  - url: http://localhost:3000
    description: local dev

security:
  - DeviceKey: []

tags:
  - name: system
  - name: devices
  - name: home
  - name: search
  - name: catalog
  - name: playlists
  - name: library
  - name: signals
  - name: personalization
  - name: charts

paths:
  /healthz:
    get:
      tags: [system]
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /v1/devices:
    post:
      tags: [devices]
      summary: Register a device (silent, no login)
      description: Returns the device key exactly once; clients persist it in Keychain/EncryptedSharedPreferences.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceRegistrationRequest" }
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceRegistrationResponse" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /v1/home:
    get:
      tags: [home]
      summary: Personalized home rows for this device
      description: |
        Assembles the M1 home: greeting, two-column quick grid, and the
        recent-rotation / made-for-you / new-releases / artists-to-know /
        browse-genres rows. Empty rows are omitted.
      responses:
        "200":
          description: Home payload
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HomeResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/me/taste:
    post:
      tags: [personalization]
      summary: Taste picker submit {artist_ids[]} (≥ 3) — seeds TasteProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [artist_ids]
              properties:
                artist_ids:
                  type: array
                  minItems: 3
                  maxItems: 20
                  items: { type: string, format: uuid }
      responses:
        "204": { description: Taste profile seeded (M3) }

  /v1/home/shelves:
    get:
      tags: [personalization]
      summary: Adaptive home — ordered shelves + payloads for the listener state
      responses:
        "200": { description: Shelf set (M5) }

  /v1/search/suggest:
    get:
      tags: [search]
      summary: Prefix suggestions (target < 300 ms, cached 60 s)
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 100 }
      responses:
        "200":
          description: Suggestion list (at most 8 rows; first row submits the query)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchSuggestResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /v1/search:
    get:
      tags: [search]
      summary: Typed search results
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 100 }
        - name: type
          in: query
          schema: { type: string, enum: [song, album, artist, playlist] }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Result page (limit/offset apply per group)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /v1/browse/genres:
    get:
      tags: [catalog]
      summary: Genre/category tiles (featured first, OPM leads)
      responses:
        "200":
          description: Genre list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenresResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/browse/genres/{id}:
    get:
      tags: [catalog]
      summary: Tracks for a genre
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Genre detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenreDetailResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/stations/{seed}:
    get:
      tags: [catalog]
      summary: Radio track list for a seed (artist/track/genre/search text)
      parameters: [{ $ref: "#/components/parameters/Seed" }]
      responses:
        "200":
          description: Station tracks
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StationResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tracks/{id}:
    get:
      tags: [catalog]
      summary: Track metadata
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Track detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrackDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tracks/{id}/stream:
    get:
      tags: [catalog]
      summary: 302 to a signed, ~4 h TTL stream URL
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "302": { description: Redirect to stream (M2) }

  /v1/tracks/{id}/lyrics:
    get:
      tags: [catalog]
      summary: LRC + offset (P4 — lead audio 0.5 s)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: Lyrics payload (M4) }

  /v1/artists/{id}:
    get:
      tags: [catalog]
      summary: Artist + top tracks + releases
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Artist detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArtistDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/artists/{id}/similar:
    get:
      tags: [personalization]
      summary: Similar artists from taste-space neighbors, top 10, seed excluded
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: Similar artists (M5) }

  /v1/albums/{id}:
    get:
      tags: [catalog]
      summary: Album + tracks
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Album detail (tracks in album order)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlbumDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/charts:
    get:
      tags: [charts]
      summary: Global or personal Top 50 snapshot — rank, movement, deduplicated plays
      parameters:
        - { name: scope, in: query, schema: { type: string, enum: [global, personal] } }
        - { name: window, in: query, schema: { type: string, enum: [day, week] } }
      responses:
        "200": { description: Chart snapshot (M5) }

  /v1/me/state:
    get:
      tags: [personalization]
      summary: Current listener state (new / casual / regular / super-fan) + signal summary
      responses:
        "200": { description: Listener state (M5) }

  /v1/playlists:
    get:
      tags: [playlists]
      summary: My playlists
      responses:
        "200": { description: Playlist list (M3) }
    post:
      tags: [playlists]
      summary: Create playlist
      responses:
        "201": { description: Created (M3) }

  /v1/playlists/{id}:
    patch:
      tags: [playlists]
      summary: Rename / description / cover / privacy / sort
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: Updated (M3) }
    delete:
      tags: [playlists]
      summary: Delete playlist
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: Deleted (M3) }

  /v1/playlists/{id}/tracks:
    post:
      tags: [playlists]
      summary: Add tracks {track_ids[], position?}
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "201": { description: Added (M3) }

  /v1/playlists/{id}/tracks/{trackId}:
    delete:
      tags: [playlists]
      summary: Remove track
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { $ref: "#/components/parameters/TrackId" }
      responses:
        "204": { description: Removed (M3) }

  /v1/playlists/{id}/order:
    patch:
      tags: [playlists]
      summary: Persist new order {track_id, position}[]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: Reordered (M3) }

  /v1/likes/{trackId}:
    put:
      tags: [library]
      summary: Like a track
      parameters: [{ $ref: "#/components/parameters/TrackId" }]
      responses:
        "204": { description: Liked (M3) }
    delete:
      tags: [library]
      summary: Unlike a track
      parameters: [{ $ref: "#/components/parameters/TrackId" }]
      responses:
        "204": { description: Unliked (M3) }

  /v1/library:
    get:
      tags: [library]
      summary: Playlists, followed artists, saved albums
      parameters:
        - { name: include, in: query, schema: { type: string, enum: [playlists, artists, albums] } }
      responses:
        "200": { description: Library (M3) }

  /v1/library/{type}/{id}:
    put:
      tags: [library]
      summary: Follow / save
      parameters:
        - { name: type, in: path, schema: { type: string, enum: [artist, album, playlist] } }
        - { $ref: "#/components/parameters/Id" }
      responses:
        "204": { description: Saved (M3) }
    delete:
      tags: [library]
      summary: Unfollow / unsave
      parameters:
        - { name: type, in: path, schema: { type: string, enum: [artist, album, playlist] } }
        - { $ref: "#/components/parameters/Id" }
      responses:
        "204": { description: Removed (M3) }

  /v1/events/listen:
    post:
      tags: [signals]
      summary: Batched listen events (offline replay; feeds personalization M5)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ListenEventsRequest" }
      responses:
        "202":
          description: Events accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListenEventsResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /v1/recents:
    get:
      tags: [signals]
      summary: Grouped recents feed (today / yesterday / older ISO days)
      responses:
        "200":
          description: Recents
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecentsResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

components:
  securitySchemes:
    DeviceKey:
      type: apiKey
      in: header
      name: X-Device-Key

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    TrackId:
      name: trackId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Seed:
      name: seed
      in: path
      required: true
      schema: { type: string }

  responses:
    BadRequest:
      description: Malformed request
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    ValidationError:
      description: Validation failed
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: Not found
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthorized:
      description: Missing or unknown X-Device-Key
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Health:
      type: object
      required: [status, version, uptime_s]
      properties:
        status: { type: string, const: ok }
        version: { type: string }
        uptime_s: { type: integer }

    Problem:
      description: RFC 7807 error envelope
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        errors:
          type: array
          items:
            type: object
            properties:
              path: { type: string }
              message: { type: string }
        trace_id: { type: string, format: uuid }

    DeviceRegistrationRequest:
      type: object
      required: [display_name, platform]
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 32
          description: Trimmed server-side.
        platform: { type: string, enum: [ios, android] }

    DeviceRegistrationResponse:
      type: object
      required: [device_id, device_key, display_name, platform, created_at]
      properties:
        device_id: { type: string, format: uuid }
        device_key:
          type: string
          description: 43-char base64url (32 bytes); returned exactly once.
        display_name: { type: string }
        platform: { type: string, enum: [ios, android] }
        created_at: { type: string, format: date-time }

    # ---------- Catalog ----------

    TrackSummary:
      type: object
      required: [id, title, artist_id, artist_name, duration_ms, has_lyrics, explicit, play_count, genres]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        artist_id: { type: string, format: uuid }
        artist_name: { type: string }
        album_id: { type: [string, "null"], format: uuid }
        album_title: { type: [string, "null"] }
        duration_ms: { type: integer, minimum: 0 }
        has_lyrics: { type: boolean }
        explicit: { type: boolean }
        art_url: { type: [string, "null"] }
        play_count: { type: integer, minimum: 0 }
        genres:
          type: array
          items: { type: string }

    AlbumSummary:
      type: object
      required: [id, title, artist_id, artist_name, type, track_count]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        artist_id: { type: string, format: uuid }
        artist_name: { type: string }
        type: { type: string, enum: [album, single, ep] }
        release_date: { type: [string, "null"], format: date }
        art_url: { type: [string, "null"] }
        track_count: { type: integer, minimum: 0 }

    ArtistSummary:
      type: object
      required: [id, name, is_verified, genres]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        art_url: { type: [string, "null"] }
        is_verified: { type: boolean }
        genres:
          type: array
          items: { type: string }

    ArtistDetail:
      allOf:
        - $ref: "#/components/schemas/ArtistSummary"
        - type: object
          required: [monthly_listeners, top_tracks, releases]
          properties:
            bio: { type: [string, "null"] }
            monthly_listeners: { type: integer, minimum: 0 }
            top_tracks:
              type: array
              items: { $ref: "#/components/schemas/TrackSummary" }
            releases:
              type: array
              items: { $ref: "#/components/schemas/AlbumSummary" }

    AlbumDetail:
      allOf:
        - $ref: "#/components/schemas/AlbumSummary"
        - type: object
          required: [tracks, more_by_artist]
          properties:
            tracks:
              type: array
              items: { $ref: "#/components/schemas/TrackSummary" }
            more_by_artist:
              type: array
              items: { $ref: "#/components/schemas/AlbumSummary" }

    TrackDetail:
      allOf:
        - $ref: "#/components/schemas/TrackSummary"
        - type: object
          required: [lyrics_available]
          properties:
            lyrics_available: { type: boolean }

    # ---------- Search ----------

    SearchSuggestion:
      type: object
      required: [type, text]
      properties:
        type: { type: string, enum: [query, song, album, artist] }
        text: { type: string }
        subtitle: { type: string }
        id: { type: string, format: uuid }

    SearchSuggestResponse:
      type: object
      required: [query, suggestions]
      properties:
        query: { type: string }
        suggestions:
          type: array
          maxItems: 8
          items: { $ref: "#/components/schemas/SearchSuggestion" }

    PlaylistSummary:
      type: object
      required: [id, name, owner, track_count]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        owner: { type: string }
        track_count: { type: integer, minimum: 0 }
        art_url: { type: [string, "null"] }

    SearchResponse:
      type: object
      required: [query, type, limit, offset, total, degraded, songs, albums, artists, playlists]
      properties:
        query: { type: string }
        type: { type: string, enum: [all, song, album, artist, playlist] }
        limit: { type: integer }
        offset: { type: integer }
        total:
          type: integer
          description: Combined count across returned groups, before pagination.
        degraded:
          type: boolean
          description: True when the YTM adapter failed and own/cached rows were served.
        artist_header:
          oneOf:
            - { $ref: "#/components/schemas/ArtistSummary" }
            - { type: "null" }
        songs:
          type: array
          items: { $ref: "#/components/schemas/TrackSummary" }
        albums:
          type: array
          items: { $ref: "#/components/schemas/AlbumSummary" }
        artists:
          type: array
          items: { $ref: "#/components/schemas/ArtistSummary" }
        playlists:
          type: array
          items: { $ref: "#/components/schemas/PlaylistSummary" }

    # ---------- Home & browse ----------

    CatalogCard:
      type: object
      required: [kind, id, title]
      properties:
        kind: { type: string, enum: [track, album, artist, genre] }
        id: { type: string }
        title: { type: string }
        subtitle: { type: string }
        art_url: { type: [string, "null"] }

    HomeRow:
      type: object
      required: [key, title, items]
      properties:
        key: { type: string }
        title: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/CatalogCard" }

    HomeResponse:
      type: object
      required: [greeting, quick_grid, rows]
      properties:
        greeting: { type: string }
        quick_grid:
          type: array
          items: { $ref: "#/components/schemas/CatalogCard" }
        rows:
          type: array
          items: { $ref: "#/components/schemas/HomeRow" }

    GenreSummary:
      type: object
      required: [id, name, featured, track_count]
      properties:
        id: { type: string }
        name: { type: string }
        featured: { type: boolean }
        track_count: { type: integer, minimum: 0 }
        art_url: { type: [string, "null"] }

    GenresResponse:
      type: object
      required: [genres]
      properties:
        genres:
          type: array
          items: { $ref: "#/components/schemas/GenreSummary" }

    GenreDetailResponse:
      type: object
      required: [genre, tracks]
      properties:
        genre: { $ref: "#/components/schemas/GenreSummary" }
        tracks:
          type: array
          items: { $ref: "#/components/schemas/TrackSummary" }

    StationResponse:
      type: object
      required: [seed, title, description, tracks]
      properties:
        seed: { type: string }
        title: { type: string }
        description: { type: string }
        tracks:
          type: array
          items: { $ref: "#/components/schemas/TrackSummary" }

    # ---------- Signals ----------

    ListenEventInput:
      type: object
      required: [track_id, ms_played, completed]
      properties:
        track_id: { type: string, format: uuid }
        played_at: { type: string, format: date-time }
        ms_played: { type: integer, minimum: 0, maximum: 86400000 }
        completed: { type: boolean }

    ListenEventsRequest:
      type: object
      required: [events]
      properties:
        events:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/ListenEventInput" }

    ListenEventsResponse:
      type: object
      required: [accepted]
      properties:
        accepted: { type: integer, minimum: 0 }

    RecentItem:
      type: object
      required: [track, played_at, ms_played, completed]
      properties:
        track: { $ref: "#/components/schemas/TrackSummary" }
        played_at: { type: string, format: date-time }
        ms_played: { type: integer, minimum: 0 }
        completed: { type: boolean }

    RecentGroup:
      type: object
      required: [day, items]
      properties:
        day:
          type: string
          description: '"today", "yesterday", or an ISO date for older groups.'
        items:
          type: array
          items: { $ref: "#/components/schemas/RecentItem" }

    RecentsResponse:
      type: object
      required: [groups]
      properties:
        groups:
          type: array
          items: { $ref: "#/components/schemas/RecentGroup" }
