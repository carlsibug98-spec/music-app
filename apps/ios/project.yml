# XcodeGen manifest — generate the Xcode project with:
#   brew install xcodegen && xcodegen generate
# (keeps the repo free of .xcodeproj merge conflicts; doc 02 §3)
name: Resona
options:
  bundleIdPrefix: com.resona
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"        # iPhone first
    CODE_SIGN_IDENTITY: "-"            # personal sideloading; see docs (free provisioning)
    DEVELOPMENT_TEAM: ""               # fill with your Apple ID team when sideloading

targets:
  Resona:
    type: application
    platform: iOS
    sources:
      - Resona
    info:
      path: Resona/Support/Info.plist
      properties:
        CFBundleDisplayName: Resona
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}              # system launch screen (dark via UIUserInterfaceStyle)
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark      # dark-first (doc 03 §1)
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.resona.app
        GENERATE_INFOPLIST_FILE: false
